<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CereWare Finances</title>
    <script>
      try { var t = localStorage.getItem('cwf-theme') || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t; } catch (e) {}
      try { var z = localStorage.getItem('cwf-scale') || 'auto', w = screen.width || innerWidth;
        if (z === 'auto') z = w >= 3400 ? 1.5 : w >= 2400 ? 1.2 : w >= 1900 ? 1.05 : 1;
        document.documentElement.style.zoom = z; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
