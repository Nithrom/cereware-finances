[package]
name = "cereware-finances"
version = "0.2.1"
description = "CereWare Finances"
authors = ["CereWare"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cereware_finances_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled", "serialize"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
csv = "1"
calamine = "0.31"
sha2 = "0.10"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tauri-plugin-dialog = "2"
ureq = { version = "2", features = ["json"] }
jsonwebtoken = "9"


[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-keystore = "=2.1.0-alpha.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
